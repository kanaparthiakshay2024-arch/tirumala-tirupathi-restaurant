name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Project & Plugins
        run: npx @capacitor/cli sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../gradle-output.log

      - name: Push failure log to branch on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log-branch
          git add -f gradle-output.log
          git commit -m "chore: save build log"
          git push -f origin build-log-branch

      - name: Locate and Prepare APK
        run: |
          echo "Scanning for compiled APK..."
          find android -name "*.apk" -type f
          mkdir -p release-apk
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in android directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp -v "$APK_PATH" release-apk/app-debug.apk
          ls -lh release-apk/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tirumala-Tirupati-Restaurant-APK
          path: release-apk/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "📱 Tirumala Tirupati Restaurant Mobile App (APK)"
          body: |
            ## 🛕 Tirumala Tirupati Restaurant Mobile Application

            Official Android Mobile App for **Tirumala Tirupati Restaurant** (Near Tata Automobile Showroom, beside Tirupati Busstand).

            ### ✨ App Features
            - 🌿 **Pure Satvik South Indian Dining**: Complete menu without onion or garlic
            - 🛕 **Srivari Naivedyam**: Sacred Tirupati Laddu, Pulihora, Chakkara Pongal, and Daddojanam
            - 📸 **Devotee Reviews with Dining Photos**: Upload dining photos and receive personalized kitchen auto-replies
            - 🪑 **Table Reservations**: Book Air Conditioned dining and family tables
            - 🛵 **Food Delivery Coordination**: Real-time order placement with distance tracking
            - ⚡ **Supabase Cloud Database**: Real-time PostgreSQL synchronization
            - 📶 **Offline-Ready**: Instant loading with offline caching

            ### 📲 Installation Instructions for Android
            1. Download `app-debug.apk` below directly to your Android phone.
            2. Open the downloaded file from your notifications or Downloads folder.
            3. Tap **Install** (if prompted, enable *"Install unknown apps"* for your browser in Settings).
            4. Open **Tirumala Tirupati Restaurant** on your phone!
          files: release-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
