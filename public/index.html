  <!-- 3D Moving Canvas Background Script -->
  <script>
    (function() {
      const canvas = document.getElementById('bg3dCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: Math.random() * width, y: Math.random() * height, z: Math.random() * 1000,
          radius: Math.random() * 3 + 1, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4 - 0.2, vz: (Math.random() - 0.5) * 0.5,
          color: i % 3 === 0 ? 'rgba(212, 175, 55, ' : (i % 3 === 1 ? 'rgba(243, 229, 171, ' : 'rgba(255, 215, 0, '), angle: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      function render3D() {
        ctx.clearRect(0, 0, width, height);
        time += 0.01;
        const grad = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, Math.max(width, height));
        grad.addColorStop(0, '#2D060A'); grad.addColorStop(0.5, '#1A0407'); grad.addColorStop(1, '#0F0204');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

        particles.forEach(p => {
          p.x += p.vx + Math.sin(time + p.angle) * 0.3; p.y += p.vy; p.z += p.vz;
          if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
          const scale = 400 / (400 + p.z);
          const x2d = (p.x - width / 2) * scale + width / 2;
          const y2d = (p.y - height / 2) * scale + height / 2;
          ctx.beginPath(); ctx.arc(x2d, y2d, p.radius * scale * 1.8, 0, Math.PI * 2);
          ctx.fillStyle = p.color + Math.min(0.8, (1 - p.z / 1000) * 0.7) + ')';
          ctx.fill();
        });
        requestAnimationFrame(render3D);
      }
      render3D();
    })();
  </script>

  <!-- React Web Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const EXACT_ADDRESS = "Tirumala Tirupati Restaurant, Near Tata Automobile Showroom, Beside Tirupati Busstand, PIN code 517501, Andhra Pradesh, India";

    // Helper to highlight matching text in dish names
    const HighlightText = ({ text, query }) => {
      if (!query.trim()) return <span>{text}</span>;
      const parts = text.split(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'));
      return (
        <span>
          {parts.map((part, i) => 
            part.toLowerCase() === query.toLowerCase() ? (
              <span key={i} className="highlight-match">{part}</span>
            ) : (
              part
            )
          )}
        </span>
      );
    };

    // --- USER WHATSAPP MPEG AUDIO PLAYER ---
    const BackgroundAudioPlayer = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => {
            console.error('Audio play error:', err);
          });
        }
      };

      return (
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: '10px', background: 'rgba(74, 14, 23, 0.85)', backdropFilter: 'blur(10px)', border: '1.5px solid #D4AF37', borderRadius: '25px', padding: '4px 14px', color: '#F3E5AB' }}>
          <audio ref={audioRef} loop src="/WhatsApp%20Audio%202026-07-29%20at%2012.08.25%20PM.mpeg" preload="auto" />
          <span style={{ fontSize: '0.8rem', fontWeight: 600, fontFamily: 'Cinzel, serif' }}>🎵 Background Sacred Music</span>
          <button onClick={togglePlay} style={{ background: 'var(--gold-primary)', color: '#380910', border: 'none', borderRadius: '50%', width: '28px', height: '28px', cursor: 'pointer', fontWeight: 800 }}>
            {isPlaying ? '⏸' : '▶'}
          </button>
        </div>
      );
    };

    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [menuItems, setMenuItems] = useState([]);
      const [dailySpecial, setDailySpecial] = useState(null);
      const [cart, setCart] = useState([]);
      
      // PERSISTENT USER SESSION
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('tirupati_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      
      // Dedicated Login State
      const [loginIdentifier, setLoginIdentifier] = useState('devotee@tirupati.com');
      const [loginPassword, setLoginPassword] = useState('demo123');

      // Registration State
      const [regName, setRegName] = useState('');
      const [regMobile, setRegMobile] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');

      // SELECTED ITEM MODAL STATE (SHOWS INGREDIENTS USED WHEN CLICKED!)
      const [selectedFoodModal, setSelectedFoodModal] = useState(null);

      // SEARCH BAR STATE & DROPDOWN OPEN STATUS
      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchDropdownOpen, setIsSearchDropdownOpen] = useState(false);

      const [activeTimeSlot, setActiveTimeSlot] = useState('12pm-6pm');

      // Table Reservation State
      const [resFullName, setResFullName] = useState('');
      const [resMobile, setResMobile] = useState('');
      const [resDate, setResDate] = useState('2026-07-30');
      const [resTimeSlot, setResTimeSlot] = useState('19:30 (Dinner)');
      const [resGuests, setResGuests] = useState(4);
      const [resSeatingArea, setResSeatingArea] = useState('Indoor Air Conditioned');
      const [resSpecialRequests, setResSpecialRequests] = useState('');
      const [tableReservedSuccess, setTableReservedSuccess] = useState(null);

      // Checkout form
      const [houseNo, setHouseNo] = useState('');
      const [street, setStreet] = useState('');
      const [area, setArea] = useState('');
      const [city, setCity] = useState('Tirupati');
      const [pinCode, setPinCode] = useState('517501');
      const [primaryMobile, setPrimaryMobile] = useState('');
      const [secondaryMobile, setSecondaryMobile] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('UPI');

      useEffect(() => {
        fetch('/api/menu/items').then(r => r.json()).then(d => setMenuItems(d));
        fetch('/api/menu/daily-special').then(r => r.json()).then(d => setDailySpecial(d));
      }, []);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (!loginIdentifier || !loginPassword) return alert('Please enter both Email/Mobile and Password!');
        
        fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ identifier: loginIdentifier, password: loginPassword })
        }).then(r => r.json()).then(d => {
          if (d.error) alert(d.error);
          else {
            setUser(d.user);
            localStorage.setItem('tirupati_user', JSON.stringify(d.user));
            setIsAuthOpen(false);
            alert(`Welcome back, ${d.user.name}! 🙏`);
          }
        });
      };

      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        if (!regEmail || !regPassword) return alert('Email and Password are required for registration!');

          method: 'POST',
          headers: {'Content-Type': 'application/json'},

          else {
            setUser(d.user);
            localStorage.setItem('tirupati_user', JSON.stringify(d.user));
            setIsAuthOpen(false);
            alert(`Account registered successfully! Welcome ${d.user.name}.`);

        setUser(null);

          return [...prev, { ...item, quantity: 1 }];

        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else window.scrollBy({ top: 500, behavior: 'smooth' });
      };

      const handleBookTableSubmit = (e) => {
        e.preventDefault();
        if (!resFullName || !resMobile) return alert('Full Name and Mobile Number are required for table booking!');
        fetch('/api/reservations', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},

        return searchQuery === '' || 
          item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.description.toLowerCase().includes(searchQuery.toLowerCase());
      });

        if (searchQuery !== '') return item.name.toLowerCase().includes(searchQuery.toLowerCase()) || item.description.toLowerCase().includes(searchQuery.toLowerCase());
        if (activeTimeSlot === '6am-11am') return item.category_slug === 'breakfast';
        if (activeTimeSlot === '12pm-6pm') return item.category_slug === 'lunch';
        if (activeTimeSlot === '6pm-11pm') return item.category_slug === 'naivedyam' || item.category_slug === 'dinner';
        return true;
      });

      return (
        <div onClick={() => setIsSearchDropdownOpen(false)}>
          {/* HEADER */}
          <header className="glass-header" style={{ color: '#FFF', position: 'sticky', top: 0, zIndex: 100 }}>
            <div style={{ backgroundColor: 'rgba(56, 9, 16, 0.88)', padding: '6px 20px', fontSize: '0.78rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: '#F3E5AB' }}>
              <span>📍 {EXACT_ADDRESS}</span>
              <BackgroundAudioPlayer />
            </div>

            <div style={{ maxWidth: '1320px', margin: '0 auto', padding: '12px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '15px' }}>
              <div onClick={() => setCurrentPage('home')} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }}>

                <div>
                  <h1 style={{ fontFamily: 'Cinzel, serif', fontSize: '1.45rem', color: 'var(--gold-primary)', fontWeight: 800 }}>TIRUMALA TIRUPATI RESTAURANT</h1>
                  <p style={{ fontSize: '0.72rem', color: '#F3E5AB' }}>Pure South Indian Satvik Vegetarian</p>
                </div>

                <input
                  type="text"

                  onFocus={() => setIsSearchDropdownOpen(true)}

                  className="search-input-glass"

                  </h3>
                  <p style={{ fontSize: '0.88rem', color: 'var(--text-muted)', marginBottom: '15px' }}>
                    Inspect our authentic temple-style 4, 6, 10, and 12-seater table arrangements for your reference:
                  </p>
                  
                  <div style={{ borderRadius: '12px', overflow: 'hidden', border: '2.5px solid var(--gold-primary)', boxShadow: '0 10px 30px rgba(0,0,0,0.3)' }}>
                    <img 
                      src="/table_guide.jpg" 
                      alt="Tirupati Restaurant Traditional Dining Tables Reference Guide" 
                      style={{ width: '100%', height: 'auto', display: 'block' }} 
                    />
                  </div>

                  <div onClick={() => document.getElementById('booking-form-anchor').scrollIntoView({ behavior: 'smooth' })} className="scroll-down-btn" style={{ marginTop: '20px' }}>
                    <span>SCROLL DOWN TO BOOK TABLE FORM</span>
                    <span style={{ fontSize: '1.3rem' }}>↓</span>
                  </div>
                </div>

                <div id="booking-form-anchor"></div>

                {tableReservedSuccess ? (
                  <div className="glass-panel" style={{ padding: '35px', textAlign: 'center', marginTop: '30px', borderRadius: '16px' }}>
                    <div style={{ fontSize: '3rem', marginBottom: '10px' }}>✅</div>
                    <h2 style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)' }}>Table Reservation Confirmed!</h2>
                    <p style={{ color: 'var(--text-muted)', margin: '10px 0' }}>Reservation Code: <strong>{tableReservedSuccess.reservation_code}</strong></p>
                    <p style={{ fontSize: '0.95rem' }}>We look forward to hosting <strong>{tableReservedSuccess.details.name}</strong> for <strong>{tableReservedSuccess.details.guests} guests</strong> on {tableReservedSuccess.details.res_date} ({tableReservedSuccess.details.res_time}).</p>
                    <button onClick={() => setTableReservedSuccess(null)} className="btn-maroon" style={{ marginTop: '20px' }}>Book Another Table</button>
                  </div>
                ) : (
                  <form onSubmit={handleBookTableSubmit} className="glass-panel" style={{ padding: '30px', marginTop: '30px', display: 'flex', flexDirection: 'column', gap: '16px', borderRadius: '16px' }}>
                    <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)' }}>Table Reservation Form</h3>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Full Name *</label>
                        <input type="text" required placeholder="Enter full name" value={resFullName} onChange={e=>setResFullName(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }} />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Mobile Number *</label>
                        <input type="tel" required placeholder="10-digit mobile" value={resMobile} onChange={e=>setResMobile(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }} />
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Date of Visit *</label>
                        <input type="date" required value={resDate} onChange={e=>setResDate(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }} />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Preferred Time Slot *</label>
                        <select value={resTimeSlot} onChange={e=>setResTimeSlot(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }}>
                          <option value="08:00 AM (Morning Tiffins)">08:00 AM (Morning Tiffins)</option>
                          <option value="10:00 AM (Morning Tiffins)">10:00 AM (Morning Tiffins)</option>
                          <option value="12:30 PM (Afternoon Bhojanam)">12:30 PM (Afternoon Bhojanam)</option>
                          <option value="02:00 PM (Afternoon Bhojanam)">02:00 PM (Afternoon Bhojanam)</option>
                          <option value="05:00 PM (Evening Snacks)">05:00 PM (Evening Snacks)</option>
                          <option value="07:30 PM (Divine Dinner)">07:30 PM (Divine Dinner)</option>
                          <option value="09:00 PM (Divine Dinner)">09:00 PM (Divine Dinner)</option>
                        </select>
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Number of Guests (Table for 4, 6, 10, 12, etc.) *</label>
                        <select value={resGuests} onChange={e=>setResGuests(parseInt(e.target.value))} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }}>
                          <option value={2}>Table for 2 Members</option>
                          <option value={4}>Table for 4 Members</option>
                          <option value={6}>Table for 6 Members</option>
                          <option value={10}>Table for 10 Members</option>
                          <option value={12}>Table for 12 Members</option>
                          <option value={15}>Table for 15+ Members (Large Group)</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Preferred Seating Area *</label>
                        <select value={resSeatingArea} onChange={e=>setResSeatingArea(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }}>
                          <option value="Indoor Air Conditioned">Indoor Air Conditioned</option>
                          <option value="Outdoor Garden Courtyard">Outdoor Garden Courtyard</option>
                          <option value="Traditional Wooden Floor Seating">Traditional Wooden Floor Seating</option>
                          <option value="VIP Family Sanctuary">VIP Family Sanctuary</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--maroon-header)' }}>Special Requests / Occasion</label>
                      <textarea rows={2} placeholder="e.g. Birthday celebration, High chair for infant, Wheelchair access..." value={resSpecialRequests} onChange={e=>setResSpecialRequests(e.target.value)} style={{ width: '100%', padding: '10px', borderRadius: '6px', border: '1px solid #CCC' }} />
                    </div>

                    <button type="submit" className="btn-primary-green" style={{ width: '100%', justifyContent: 'center', padding: '14px', fontSize: '1.05rem', marginTop: '10px' }}>
                      Confirm Booking for Table ({resGuests} Members)
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* FULL VEG MENU PAGE */}
            {currentPage === 'menu' && (
              <div style={{ maxWidth: '1200px', margin: '40px auto', padding: '0 20px' }}>
                <h1 className="section-title" style={{ color: '#FFF' }}>Complete Pure Veg Menu</h1>
                <div className="gold-accent-line"></div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '25px', marginTop: '30px' }}>
                  {filteredMenuItems.map(item => (
                    <div key={item.id} className="glass-card" onClick={() => setSelectedFoodModal(item)} style={{ padding: '16px' }}>
                      <img src={item.image_url} style={{ width: '100%', height: '170px', objectFit: 'cover', borderRadius: '6px' }} />
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px' }}>
                        <span className="veg-badge"><span className="veg-dot"></span> 100% Veg</span>
                        <span style={{ fontSize: '0.75rem', color: 'var(--gold-dark)', fontWeight: 700 }}>🔍 Click for Ingredients</span>
                      </div>
                      <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)', marginTop: '6px' }}>
                        <HighlightText text={item.name} query={searchQuery} />
                      </h3>
                      <p style={{ fontSize: '0.82rem', color: '#555', margin: '6px 0' }}>{item.description}</p>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px' }}>
                        <span style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--maroon-header)' }}>₹{item.offer_price || item.price}</span>
                        <button onClick={e => { e.stopPropagation(); addToCart(item); }} className="btn-primary-green" style={{ padding: '6px 14px' }}>+ Add</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SACRED NAIVEDYAM PAGE */}
            {currentPage === 'naivedyam' && (
              <div style={{ maxWidth: '1200px', margin: '40px auto', padding: '0 20px' }}>
                <h1 className="section-title" style={{ color: '#FFF' }}>Worship Offerings (Naivedyam)</h1>
                <div className="gold-accent-line"></div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '25px', marginTop: '30px' }}>
                  {menuItems.filter(i=>i.category_slug==='naivedyam').map(item => (
                    <div key={item.id} className="glass-card" onClick={() => setSelectedFoodModal(item)} style={{ padding: '18px' }}>
                      <img src={item.image_url} style={{ width: '100%', height: '200px', objectFit: 'cover', borderRadius: '6px' }} />
                      <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)', marginTop: '10px' }}>{item.name}</h3>
                      <p style={{ fontSize: '0.85rem', margin: '6px 0' }}>{item.description}</p>
                      {item.worship_significance && (
                        <div style={{ backgroundColor: 'rgba(212,175,55,0.15)', padding: '10px', borderRadius: '6px', fontSize: '0.8rem', color: 'var(--maroon-header)', margin: '10px 0', borderLeft: '3px solid var(--gold-primary)' }}>
                          <strong>✨ Spiritual Worship Significance:</strong> {item.worship_significance}
                        </div>
                      )}
                      <button onClick={e => { e.stopPropagation(); addToCart(item); }} className="btn-primary-green" style={{ width: '100%', justifyContent: 'center', marginTop: '10px' }}>Add Sacred Naivedyam</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CART PAGE */}
            {currentPage === 'cart' && (
              <div style={{ maxWidth: '900px', margin: '40px auto', padding: '0 20px' }}>
                <h1 className="section-title" style={{ color: '#FFF' }}>Your Cart</h1>
                <div className="glass-panel" style={{ padding: '25px', borderRadius: '16px', marginTop: '20px' }}>
                  {cart.map(i => (
                    <div key={i.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '12px', borderBottom: '1px solid #DDD' }}>
                      <span>{i.name} x {i.quantity}</span>
                      <span>₹{i.price * i.quantity}</span>
                    </div>
                  ))}
                  <div style={{ fontSize: '1.3rem', fontWeight: 800, textAlign: 'right', marginTop: '15px' }}>Total: ₹{subtotal}</div>
                  <button onClick={() => setCurrentPage('checkout')} className="btn-primary-green" style={{ marginTop: '15px', float: 'right' }}>Proceed to Checkout</button>
                </div>
              </div>
            )}

            {/* CHECKOUT PAGE */}
            {currentPage === 'checkout' && (
              <div style={{ maxWidth: '800px', margin: '40px auto', padding: '0 20px' }}>
                <h1 className="section-title" style={{ color: '#FFF' }}>Delivery & Payment</h1>
                <form onSubmit={e => { e.preventDefault(); alert('Order placed successfully!'); setCart([]); setCurrentPage('home'); }} className="glass-panel" style={{ padding: '30px', marginTop: '20px', borderRadius: '16px' }}>
                  <input type="text" required placeholder="House / Flat No." value={houseNo} onChange={e=>setHouseNo(e.target.value)} style={{ width: '100%', padding: '10px', marginBottom: '10px' }} />
                  <input type="text" required placeholder="Street" value={street} onChange={e=>setStreet(e.target.value)} style={{ width: '100%', padding: '10px', marginBottom: '10px' }} />
                  <input type="text" required placeholder="Area" value={area} onChange={e=>setArea(e.target.value)} style={{ width: '100%', padding: '10px', marginBottom: '10px' }} />
                  <input type="tel" required placeholder="Secondary Mobile (MANDATORY)" value={secondaryMobile} onChange={e=>setSecondaryMobile(e.target.value)} style={{ width: '100%', padding: '10px', marginBottom: '10px', border: '2px solid red' }} />
                  <button type="submit" className="btn-primary-green" style={{ width: '100%', justifyContent: 'center' }}>Confirm & Pay ₹{subtotal + 30}</button>
                </form>
              </div>
            )}

            {/* CONTACT PAGE */}
            {currentPage === 'contact' && (
              <div style={{ maxWidth: '950px', margin: '40px auto', padding: '0 20px' }}>
                <h1 className="section-title" style={{ color: '#FFF' }}>Contact & Leadership</h1>
                <p className="section-subtitle" style={{ color: '#F3E5AB' }}>{EXACT_ADDRESS}</p>
                <div className="gold-accent-line"></div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '20px', marginTop: '30px', textAlign: 'center' }}>
                  <div className="glass-card" style={{ padding: '20px' }}>
                    <h3>Rachakonda Mithrakumar</h3>
                    <p style={{ color: 'var(--gold-dark)', fontWeight: 700 }}>Owner</p>
                  </div>
                  <div className="glass-card" style={{ padding: '20px' }}>
                    <h3>Kanaparthi Akshay</h3>
                    <p style={{ color: 'var(--green-btn)', fontWeight: 700 }}>Manager</p>
                  </div>
                  <div className="glass-card" style={{ padding: '20px' }}>
                    <h3>Koppula Koteshwar Rao</h3>
                    <p style={{ color: 'var(--maroon-header)', fontWeight: 700 }}>Chief Chef</p>
                  </div>
                </div>

                <div className="glass-panel" style={{ padding: '25px', marginTop: '30px', borderRadius: '16px' }}>
                  <p><strong>📍 Full Address:</strong> {EXACT_ADDRESS}</p>
                  <p style={{ marginTop: '8px' }}><strong>📞 Phones:</strong> +91 9346174197, +91 9014228068, +91 8247467209</p>
                  <p style={{ marginTop: '8px' }}><strong>✉️ Email:</strong> tirumaltirupatirestarent@gmail.com</p>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="glass-header" style={{ color: '#FFF', padding: '35px 20px', marginTop: 'auto', borderTop: '4px solid var(--gold-primary)' }}>
            <div style={{ maxWidth: '1200px', margin: '0 auto', textAlign: 'center' }}>
              <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--gold-primary)' }}>Tirumala Tirupati Restaurant</h3>
              <p style={{ color: '#F3E5AB', fontSize: '0.85rem', marginTop: '4px' }}>📍 {EXACT_ADDRESS}</p>
              <p style={{ color: '#F3E5AB', fontSize: '0.85rem', marginTop: '4px' }}>Owner: Rachakonda Mithrakumar | Manager: Kanaparthi Akshay | Chief Chef: Koppula Koteshwar Rao</p>
              <p style={{ color: '#E0D6C3', fontSize: '0.82rem', marginTop: '6px' }}>Phone: +91 9346174197, +91 9014228068, +91 8247467209 | Email: tirumaltirupatirestarent@gmail.com</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
