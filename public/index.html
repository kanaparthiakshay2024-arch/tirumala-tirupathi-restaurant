  <!-- 3D Moving Canvas Background Script -->
  <script>
    (function() {
      const canvas = document.getElementById('bg3dCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      for (let i = 0; i < 65; i++) {
        particles.push({
          x: Math.random() * width, y: Math.random() * height, z: Math.random() * 1000,
          radius: Math.random() * 3 + 1, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4 - 0.2, vz: (Math.random() - 0.5) * 0.5,
          color: i % 3 === 0 ? 'rgba(212, 175, 55, ' : (i % 3 === 1 ? 'rgba(243, 229, 171, ' : 'rgba(255, 215, 0, '), angle: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      function render3D() {
        ctx.clearRect(0, 0, width, height);
        time += 0.01;
        const grad = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, Math.max(width, height));
        grad.addColorStop(0, '#2D060A'); grad.addColorStop(0.5, '#1A0407'); grad.addColorStop(1, '#0F0204');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

        particles.forEach(p => {
          p.x += p.vx + Math.sin(time + p.angle) * 0.3; p.y += p.vy; p.z += p.vz;
          if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
          const scale = 400 / (400 + p.z);
          const x2d = (p.x - width / 2) * scale + width / 2;
          const y2d = (p.y - height / 2) * scale + height / 2;
          ctx.beginPath(); ctx.arc(x2d, y2d, p.radius * scale * 1.8, 0, Math.PI * 2);
          ctx.fillStyle = p.color + Math.min(0.8, (1 - p.z / 1000) * 0.7) + ')';
          ctx.fill();
        });
        requestAnimationFrame(render3D);
      }
      render3D();
    })();
  </script>

      return (
        <span>
          {parts.map((part, i) => 
            part.toLowerCase() === query.toLowerCase() ? (

                        <div>
                          <strong style={{ color: 'var(--maroon-header)', fontSize: '0.95rem' }}>📸 Attach Customer Dining Photos:</strong>
                          <p style={{ fontSize: '0.78rem', color: '#666', margin: '2px 0 0 0' }}>Upload pictures of dishes, dining banana leaf, or your family feast from phone/camera!</p>
                        </div>
                        <span style={{ fontSize: '0.78rem', backgroundColor: 'var(--gold-primary)', color: '#380910', padding: '3px 10px', borderRadius: '12px', fontWeight: 800 }}>
                          {revImages.length} Photo{revImages.length === 1 ? '' : 's'} Selected
                        </span>
                      </div>

                      <div className="photo-upload-dropzone" onClick={() => document.getElementById('review-file-input').click()}>
                        <input
                          id="review-file-input"
                          type="file"
                          accept="image/*"
                          multiple
                          onChange={handleImageFilesChange}
                          style={{ display: 'none' }}
                        />
                        <div style={{ fontSize: '2rem', marginBottom: '6px' }}>📷</div>
                        <div style={{ fontWeight: 700, color: 'var(--maroon-header)', fontSize: '0.95rem' }}>
                          Click here to Choose Photos from Device / Camera
                        </div>
                        <div style={{ fontSize: '0.78rem', color: '#777', marginTop: '4px' }}>
                          Supports JPEG, PNG, WEBP (multiple photos allowed)
                        </div>
                      </div>

                      {/* QUICK 1-CLICK SAMPLE DINING PHOTOS */}
                      <div style={{ marginTop: '14px', paddingTop: '12px', borderTop: '1px dashed #DDD' }}>
                        <div style={{ fontSize: '0.78rem', color: '#666', fontWeight: 700, marginBottom: '6px' }}>
                          ⚡ Or 1-Click Attach Authentic Restaurant Photos:
                        </div>
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <button
                            type="button"
                            onClick={() => handleAddSampleImage('/bhojanam.jpg')}
                            style={{ padding: '5px 12px', borderRadius: '15px', border: '1px solid var(--gold-primary)', backgroundColor: '#FFF', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', color: 'var(--maroon-header)' }}
                          >
                            + 🍛 Srivari Bhojanam
                          </button>
                          <button
                            type="button"
                            onClick={() => handleAddSampleImage('/laddu.jpg')}
                            style={{ padding: '5px 12px', borderRadius: '15px', border: '1px solid var(--gold-primary)', backgroundColor: '#FFF', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', color: 'var(--maroon-header)' }}
                          >
                            + 🟡 Tirupati Laddu
                          </button>
                          <button
                            type="button"
                            onClick={() => handleAddSampleImage('/dosa.jpg')}
                            style={{ padding: '5px 12px', borderRadius: '15px', border: '1px solid var(--gold-primary)', backgroundColor: '#FFF', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', color: 'var(--maroon-header)' }}
                          >
                            + 🥞 Ghee Masala Dosa
                          </button>
                          <button
                            type="button"
                            onClick={() => handleAddSampleImage('/table_2.jpg')}
                            style={{ padding: '5px 12px', borderRadius: '15px', border: '1px solid var(--gold-primary)', backgroundColor: '#FFF', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', color: 'var(--maroon-header)' }}
                          >
                            + 🪑 Dining Table
                          </button>
                        </div>
                      </div>

                      {/* OPTIONAL IMAGE URL INPUT */}
                      <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
                        <input
                          type="url"
                          placeholder="Or paste an Image URL (https://...)"
                          value={customImageUrl}
                          onChange={e => setCustomImageUrl(e.target.value)}
                          style={{ flex: 1, padding: '8px 12px', borderRadius: '6px', border: '1px solid #CCC', fontSize: '0.82rem' }}
                        />
                        <button
                          type="button"
                          onClick={handleAddCustomImageUrl}
                          style={{ padding: '8px 14px', borderRadius: '6px', backgroundColor: 'var(--maroon-header)', color: 'var(--gold-glow)', border: 'none', fontWeight: 700, fontSize: '0.8rem', cursor: 'pointer' }}
                        >
                          + Add URL
                        </button>
                      </div>

                      {/* SELECTED PHOTO PREVIEWS WITH REMOVE (X) */}
                      {revImages.length > 0 && (
                        <div style={{ marginTop: '16px' }}>
                          <div style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--maroon-header)', marginBottom: '8px' }}>
                            Attached Photos ({revImages.length}):
                          </div>
                          <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                            {revImages.map((img, i) => (
                              <div
                                key={i}
                                style={{
                                  position: 'relative', width: '90px', height: '90px', borderRadius: '8px',
                                  overflow: 'hidden', border: '2px solid var(--gold-primary)', boxShadow: '0 4px 10px rgba(0,0,0,0.2)'
                                }}
                              >
                                <img src={img} alt={`Attached ${i}`} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                <button
                                  type="button"
                                  onClick={() => handleRemoveRevImage(i)}
                                  title="Remove this photo"
                                  style={{
                                    position: 'absolute', top: '3px', right: '3px',
                                    background: 'rgba(183, 28, 28, 0.9)', color: '#FFF',
                                    border: 'none', borderRadius: '50%', width: '22px', height: '22px',
                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    fontSize: '0.75rem', fontWeight: 800, cursor: 'pointer'
                                  }}
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmittingReview}
                      className="btn-primary-green"
                      style={{ padding: '14px', justifyContent: 'center', fontSize: '1.1rem', marginTop: '10px', boxShadow: '0 6px 20px rgba(46, 125, 50, 0.4)' }}
                    >
                      {isSubmittingReview ? 'Publishing Review & Photos...' : '✨ Submit Devotee Review & Photos'}
                    </button>
                  </form>
                </div>

                {/* LIVE REVIEWS STREAM IN CONTACT PORTAL */}
                <div style={{ marginTop: '45px' }}>
                  <div style={{ textAlign: 'center', marginBottom: '20px' }}>
                    <h2 style={{ fontFamily: 'Cinzel, serif', color: '#FFF', fontSize: '1.8rem', fontWeight: 800 }}>
                      📸 Recent Pilgrim Reviews & Photos
                    </h2>
                    <p style={{ color: '#F3E5AB', fontSize: '0.9rem' }}>
                      Verified reviews shared by devotees visiting Tirupati Restaurant
                    </p>
                    <div className="gold-accent-line"></div>
                  </div>

                  {/* FILTER TABS */}
                  <div style={{ display: 'flex', justifyContent: 'center', gap: '8px', flexWrap: 'wrap', marginBottom: '25px' }}>
                    <button
                      onClick={() => setReviewFilter('all')}
                      className="review-filter-btn"
                      style={{
                        backgroundColor: reviewFilter === 'all' ? 'var(--gold-primary)' : 'rgba(255,255,255,0.8)',
                        color: reviewFilter === 'all' ? '#380910' : 'var(--maroon-header)',
                        border: '1.5px solid var(--gold-primary)'
                      }}
                    >
                      🌟 All Reviews ({reviews.length})
                    </button>
                    <button
                      onClick={() => setReviewFilter('photos')}
                      className="review-filter-btn"
                      style={{
                        backgroundColor: reviewFilter === 'photos' ? 'var(--gold-primary)' : 'rgba(255,255,255,0.8)',
                        color: reviewFilter === 'photos' ? '#380910' : 'var(--maroon-header)',
                        border: '1.5px solid var(--gold-primary)'
                      }}
                    >
                      📸 With Customer Photos ({reviews.filter(r => r.images && r.images.length > 0).length})
                    </button>
                    <button
                      onClick={() => setReviewFilter('5star')}
                      className="review-filter-btn"
                      style={{
                        backgroundColor: reviewFilter === '5star' ? 'var(--gold-primary)' : 'rgba(255,255,255,0.8)',
                        color: reviewFilter === '5star' ? '#380910' : 'var(--maroon-header)',
                        border: '1.5px solid var(--gold-primary)'
                      }}
                    >
                      ⭐⭐⭐⭐⭐ 5 Stars Only ({reviews.filter(r => Number(r.rating) === 5).length})
                    </button>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '20px' }}>
                    {reviews.filter(r => {
                      if (reviewFilter === 'photos') return r.images && r.images.length > 0;
                      if (reviewFilter === '5star') return Number(r.rating) === 5;
                      return true;
                    }).map((r, idx) => (
                      <div key={r.id || idx} className="glass-card" style={{ padding: '20px', cursor: 'default' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '10px' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                            <div style={{
                              width: '44px', height: '44px', borderRadius: '50%',
                              background: 'linear-gradient(135deg, var(--maroon-header), #7A1A27)',
                              border: '2px solid var(--gold-primary)', color: 'var(--gold-glow)',
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                              fontWeight: 800, fontSize: '1rem', fontFamily: 'Cinzel, serif',
                              boxShadow: '0 4px 10px rgba(0,0,0,0.2)'
                            }}>
                              {(r.user_name || 'D').substring(0, 2).toUpperCase()}
                            </div>
                            <div>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' }}>
                                <strong style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)', fontSize: '0.95rem' }}>
                                  {r.user_name}
                                </strong>
                                <span style={{ backgroundColor: '#E8F5E9', color: '#1B5E20', border: '1px solid #2E7D32', fontSize: '0.7rem', padding: '1px 6px', borderRadius: '10px', fontWeight: 700 }}>
                                  ✓ Verified Devotee
                                </span>
                              </div>
                              <div style={{ fontSize: '0.72rem', color: '#777', marginTop: '2px' }}>
                                {r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Verified Pilgrim'}
                              </div>
                            </div>
                          </div>
                          
                          <div style={{ textAlign: 'right' }}>
                            <div style={{ color: '#FFD700', fontSize: '1.2rem', letterSpacing: '1px' }}>
                              {'★'.repeat(Math.min(5, Math.max(1, Number(r.rating) || 5)))}
                              {'☆'.repeat(Math.max(0, 5 - Math.min(5, Math.max(1, Number(r.rating) || 5))))}
                            </div>
                            <span style={{ fontSize: '0.72rem', backgroundColor: 'rgba(212,175,55,0.18)', color: 'var(--maroon-header)', padding: '2px 8px', borderRadius: '4px', fontWeight: 700 }}>
                              🍛 {r.dish_name || 'Satvik Feast'}
                            </span>
                          </div>
                        </div>

                        <p style={{ marginTop: '14px', fontSize: '0.9rem', color: 'var(--text-dark)', lineHeight: '1.6', fontStyle: 'italic' }}>
                          "{r.comment}"
                        </p>

                        {/* CUSTOMER ATTACHED DINING PHOTOS */}
                        {r.images && r.images.length > 0 && (
                          <div style={{ marginTop: '14px', borderTop: '1px solid rgba(212, 175, 55, 0.25)', paddingTop: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '0.75rem', fontWeight: 700, color: 'var(--maroon-header)', marginBottom: '8px' }}>
                              <span>📸 Customer Dining Photos ({r.images.length}):</span>
                              <span style={{ fontSize: '0.7rem', color: '#666', fontWeight: 500 }}>(Click to zoom)</span>
                            </div>
                            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                              {r.images.map((img, imgIdx) => (
                                <div
                                  key={imgIdx}
                                  className="review-photo-hover"
                                  onClick={() => setSelectedPhotoModal({ url: img, caption: r.dish_name || 'Tirupati Dining', reviewer: r.user_name })}
                                  style={{
                                    position: 'relative', width: '85px', height: '85px', borderRadius: '8px',
                                    overflow: 'hidden', border: '2px solid var(--gold-primary)', cursor: 'pointer',
                                    boxShadow: '0 4px 10px rgba(0,0,0,0.15)'
                                  }}
                                >
                                  <img src={img} alt="Customer Review Photo" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                                  <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, backgroundColor: 'rgba(56, 9, 16, 0.8)', color: '#FFF', fontSize: '0.6rem', textAlign: 'center', padding: '2px 0', fontWeight: 600 }}>
                                    🔍 Zoom
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '14px', borderTop: '1px solid #EEE', paddingTop: '10px' }}>
                          <button
                            type="button"
                            onClick={() => handleLikeReview(r.id)}
                            className="helpful-pill"
                          >
                            <span>👍 Helpful</span>
                            <span>({r.likes_count || 0})</span>
                          </button>
                          <span style={{ fontSize: '0.72rem', color: '#888' }}>
                            📍 Near Tirupati Busstand
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ENLARGED PHOTO LIGHTBOX MODAL */}
            {selectedPhotoModal && (
              <div className="modal-overlay" onClick={() => setSelectedPhotoModal(null)}>
                <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '800px', padding: '25px', textAlign: 'center' }}>
                  <button onClick={() => setSelectedPhotoModal(null)} style={{ position: 'absolute', right: '15px', top: '15px', background: 'none', border: 'none', fontSize: '1.6rem', cursor: 'pointer', color: 'var(--maroon-header)', fontWeight: 800 }}>✕</button>
                  <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--maroon-header)', fontSize: '1.3rem', marginBottom: '6px' }}>
                    📸 Customer Dining Photo
                  </h3>
                  <p style={{ fontSize: '0.88rem', color: '#555', marginBottom: '16px' }}>
                    Dish: <strong style={{ color: 'var(--maroon-header)' }}>{selectedPhotoModal.caption}</strong> • Shared by <strong style={{ color: 'var(--green-btn)' }}>{selectedPhotoModal.reviewer}</strong>
                  </p>
                  <div style={{ borderRadius: '12px', overflow: 'hidden', border: '3px solid var(--gold-primary)', boxShadow: '0 10px 30px rgba(0,0,0,0.35)', maxHeight: '68vh', backgroundColor: '#1a0407' }}>
                    <img
                      src={selectedPhotoModal.url}
                      alt="Enlarged Dining View"
                      style={{ width: '100%', maxHeight: '65vh', objectFit: 'contain', display: 'block', margin: '0 auto' }}
                    />
                  </div>
                  <div style={{ marginTop: '18px', display: 'flex', justifyContent: 'center' }}>
                    <button onClick={() => setSelectedPhotoModal(null)} className="btn-gold-outline" style={{ padding: '8px 24px' }}>
                      Close Photo View
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="glass-header" style={{ color: '#FFF', padding: '35px 20px', marginTop: 'auto', borderTop: '4px solid var(--gold-primary)' }}>
            <div style={{ maxWidth: '1200px', margin: '0 auto', textAlign: 'center' }}>
              <h3 style={{ fontFamily: 'Cinzel, serif', color: 'var(--gold-primary)' }}>Tirumala Tirupati Restaurant</h3>
              <p style={{ color: '#F3E5AB', fontSize: '0.85rem', marginTop: '4px' }}>📍 {EXACT_ADDRESS}</p>
              <p style={{ color: '#F3E5AB', fontSize: '0.85rem', marginTop: '4px' }}>Owner: Rachakonda Mithrakumar | Manager: Kanaparthi Akshay | Chief Chef: Koppula Koteshwar Rao</p>
              <p style={{ color: '#E0D6C3', fontSize: '0.82rem', marginTop: '6px' }}>Phone: +91 9346174197, +91 9014228068, +91 8247467209 | Email: tirumaltirupatirestarent@gmail.com</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
